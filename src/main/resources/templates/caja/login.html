<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caja - HIS</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eef2f7;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .contenedor {
      width: 390px;

      background-color: white;

      padding: 35px;

      border-radius: 12px;

      box-shadow:
              0 4px 18px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;

      text-align: center;

      color: #0b5ed7;
    }

    .subtitulo {
      text-align: center;

      color: #666;

      margin-bottom: 30px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      border: 1px solid #aaa;

      border-radius: 6px;

      font-size: 16px;
    }

    .campo input:focus {
      outline: none;
      border-color: #0b5ed7;
    }

    .boton {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 6px;

      background-color: #198754;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .boton:hover {
      background-color: #146c43;
    }

    .boton:disabled {
      background-color: #8ab89d;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 15px;

      min-height: 22px;

      text-align: center;

      font-weight: bold;
    }

    .volver {
      margin-top: 20px;

      text-align: center;
    }

    .volver a {
      color: #0b5ed7;

      text-decoration: none;
    }

    .volver a:hover {
      text-decoration: underline;
    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    Caja
  </h1>


  <p class="subtitulo">
    Sistema Informático Hospitalario
  </p>


  <!-- USUARIO -->

  <div class="campo">

    <label for="usuario">
      Nombre de usuario
    </label>


    <input
            type="text"
            id="usuario"
            autocomplete="username"
            placeholder="Ingrese su usuario">

  </div>


  <!-- CONTRASEÑA -->

  <div class="campo">

    <label for="password">
      Contraseña
    </label>


    <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Ingrese su contraseña">

  </div>


  <!-- BOTÓN -->

  <button
          type="button"
          id="btnLogin"
          class="boton"
          onclick="iniciarSesion()">

    Iniciar Sesión

  </button>


  <!-- MENSAJE -->

  <div
          id="mensaje"
          class="mensaje">
  </div>


  <!-- VOLVER -->

  <div class="volver">

    <a href="/">
      Volver al portal
    </a>

  </div>


</div>


<script>

  // =====================================================
  // INICIAR SESIÓN
  // =====================================================

  async function iniciarSesion() {

    const usuario =
            document
                    .getElementById("usuario")
                    .value
                    .trim();


    const password =
            document
                    .getElementById("password")
                    .value;


    const mensaje =
            document
                    .getElementById("mensaje");


    const boton =
            document
                    .getElementById("btnLogin");


    // =============================================
    // VALIDAR CAMPOS
    // =============================================

    if (
            usuario === "" ||
            password === ""
    ) {

      mensaje.style.color =
              "#b02a37";


      mensaje.textContent =
              "Debe ingresar usuario y contraseña.";


      return;
    }


    // =============================================
    // MENSAJE DE CARGA
    // =============================================

    mensaje.style.color =
            "#666";


    mensaje.textContent =
            "Validando credenciales...";


    boton.disabled =
            true;


    // =============================================
    // PETICIÓN AL BACKEND
    // =============================================

    try {

      const respuesta =
              await fetch(

                      "/api/caja/login",

                      {
                        method: "POST",

                        headers: {

                          "Content-Type":
                                  "application/json"

                        },

                        body:
                                JSON.stringify({

                                  nombreUsuario:
                                  usuario,

                                  password:
                                  password

                                })
                      }
              );


      // =========================================
      // VALIDAR RESPUESTA HTTP
      // =========================================

      if (!respuesta.ok) {

        mensaje.style.color =
                "#b02a37";


        mensaje.textContent =
                "No fue posible iniciar sesión.";


        boton.disabled =
                false;


        return;
      }


      const datos =
              await respuesta.json();


      // =========================================
      // LOGIN CORRECTO
      // =========================================

      if (datos.estado === "OK") {

        mensaje.style.color =
                "green";


        mensaje.textContent =
                "Inicio de sesión exitoso.";


        setTimeout(

                function () {

                  window.location.href =
                          "/caja";

                },

                700
        );


        return;
      }


      // =========================================
      // LOGIN INCORRECTO
      // =========================================

      mensaje.style.color =
              "#b02a37";


      mensaje.textContent =
              datos.mensaje;


      boton.disabled =
              false;

    }

    catch (error) {

      console.error(error);


      mensaje.style.color =
              "#b02a37";


      mensaje.textContent =
              "No se pudo conectar con el servidor.";


      boton.disabled =
              false;
    }
  }


  // =====================================================
  // ENTER PARA INICIAR SESIÓN
  // =====================================================

  document
          .getElementById("password")
          .addEventListener(

                  "keydown",

                  function(event) {

                    if (event.key === "Enter") {

                      iniciarSesion();
                    }
                  }
          );


  document
          .getElementById("usuario")
          .addEventListener(

                  "keydown",

                  function(event) {

                    if (event.key === "Enter") {

                      document
                              .getElementById("password")
                              .focus();
                    }
                  }
          );

</script>


</body>

</html>
