<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar Usuario - HIS</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0b5ed7;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            color: #0b5ed7;
            margin-top: 0;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        .acciones {
            grid-column: 1 / 3;

            display: flex;
            justify-content: flex-end;
            gap: 12px;

            margin-top: 10px;
        }

        .btn-cancelar {
            padding: 11px 18px;

            background-color: #6c757d;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .btn-actualizar {
            padding: 11px 18px;

            background-color: #0b5ed7;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .mensaje {
            grid-column: 1 / 3;

            text-align: center;
            min-height: 22px;

            margin-top: 10px;
        }

    </style>

</head>

<body>

<header>

    <h1>
        Sistema Informático Hospitalario
    </h1>

</header>


<div class="contenedor">

    <h2>
        Editar Usuario
    </h2>


    <input
            type="hidden"
            id="id"
            th:value="${usuario.id}">


    <div class="formulario">


        <div class="campo">

            <label for="nombreCompleto">
                Nombre Completo *
            </label>

            <input
                    type="text"
                    id="nombreCompleto"
                    th:value="${usuario.nombreCompleto}">

        </div>


        <div class="campo">

            <label for="correoElectronico">
                Correo Electrónico *
            </label>

            <input
                    type="email"
                    id="correoElectronico"
                    th:value="${usuario.correoElectronico}">

        </div>


        <div class="campo">

            <label for="nombreUsuario">
                Nombre de Usuario *
            </label>

            <input
                    type="text"
                    id="nombreUsuario"
                    th:value="${usuario.nombreUsuario}">

        </div>


        <div class="campo">

            <label for="password">
                Nueva Contraseña
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Dejar vacío para conservar la actual">

        </div>


        <div class="campo">

            <label for="dpi">
                Documento de Identificación
            </label>

            <input
                    type="text"
                    id="dpi"
                    maxlength="13"
                    th:value="${usuario.dpi}">

        </div>


        <div class="campo">

            <label for="numeroTelefono">
                Número de Teléfono
            </label>

            <input
                    type="text"
                    id="numeroTelefono"
                    th:value="${usuario.numeroTelefono}">

        </div>


        <div class="campo">

            <label for="rol">
                Rol *
            </label>

            <select id="rol">

                <option
                        value="ADMIN"
                        th:selected="${usuario.rol == 'ADMIN'}">

                    ADMIN

                </option>

                <option
                        value="PACIENTE"
                        th:selected="${usuario.rol == 'PACIENTE'}">

                    PACIENTE

                </option>

                <option
                        value="MEDICO"
                        th:selected="${usuario.rol == 'MEDICO'}">

                    MEDICO

                </option>

            </select>

        </div>


        <div class="campo">

            <label for="nit">
                NIT
            </label>

            <input
                    type="text"
                    id="nit"
                    th:value="${usuario.nit}">

        </div>


        <div class="campo">

            <label for="numeroSeguro">
                Número de Seguro
            </label>

            <input
                    type="text"
                    id="numeroSeguro"
                    th:value="${usuario.numeroSeguro}">

        </div>


        <div class="campo">

            <label for="sucursal">
                Sucursal
            </label>

            <input
                    type="text"
                    id="sucursal"
                    th:value="${usuario.sucursal}">

        </div>


        <div class="campo">

            <label for="especialidad">
                Especialidad
            </label>

            <input
                    type="text"
                    id="especialidad"
                    th:value="${usuario.especialidad}"
                    placeholder="Solo para médicos">

        </div>


        <div class="campo">

            <label for="activo">
                Estado *
            </label>

            <select id="activo">

                <option
                        value="true"
                        th:selected="${usuario.activo}">

                    Activo

                </option>

                <option
                        value="false"
                        th:selected="${!usuario.activo}">

                    Inactivo

                </option>

            </select>

        </div>


        <div
                id="mensaje"
                class="mensaje">
        </div>


        <div class="acciones">

            <button
                    type="button"
                    class="btn-cancelar"
                    onclick="cancelar()">

                Cancelar

            </button>


            <button
                    type="button"
                    class="btn-actualizar"
                    onclick="actualizarUsuario()">

                Actualizar

            </button>

        </div>

    </div>

</div>


<script>

    function cancelar() {

        window.location.href =
            "/admin/usuarios";
    }


    async function actualizarUsuario() {

        const id =
            document.getElementById("id")
                .value;


        const mensaje =
            document.getElementById("mensaje");


        const datos = {

            nombreCompleto:
                document.getElementById("nombreCompleto")
                    .value.trim(),

            correoElectronico:
                document.getElementById("correoElectronico")
                    .value.trim(),

            nombreUsuario:
                document.getElementById("nombreUsuario")
                    .value.trim(),

            password:
            document.getElementById("password")
                .value,

            dpi:
                document.getElementById("dpi")
                    .value.trim() || null,

            numeroTelefono:
                document.getElementById("numeroTelefono")
                    .value.trim() || null,

            rol:
            document.getElementById("rol")
                .value,

            nit:
                document.getElementById("nit")
                    .value.trim() || null,

            numeroSeguro:
                document.getElementById("numeroSeguro")
                    .value.trim() || null,

            sucursal:
                document.getElementById("sucursal")
                    .value.trim() || null,

            especialidad:
                document.getElementById("especialidad")
                    .value.trim() || null,

            activo:
                document.getElementById("activo")
                    .value === "true"

        };


        if (
            datos.nombreCompleto === "" ||
            datos.correoElectronico === "" ||
            datos.nombreUsuario === "" ||
            datos.rol === ""
        ) {

            mensaje.style.color =
                "#b02a37";

            mensaje.textContent =
                "Complete todos los campos obligatorios.";

            return;
        }


        try {

            const respuesta =
                await fetch(
                    "/api/admin/usuarios/" + id,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(datos)

                    }
                );


            const resultado =
                await respuesta.json();


            if (
                resultado.estado !== "OK"
            ) {

                mensaje.style.color =
                    "#b02a37";

                mensaje.textContent =
                    resultado.mensaje;

                return;
            }


            mensaje.style.color =
                "green";

            mensaje.textContent =
                "Usuario actualizado correctamente.";


            setTimeout(
                function () {

                    window.location.href =
                        "/admin/usuarios";

                },

                1000
            );

        }

        catch (error) {

            console.error(error);

            mensaje.style.color =
                "#b02a37";

            mensaje.textContent =
                "No se pudo conectar con el servidor.";

        }

    }

</script>

</body>

</html>
