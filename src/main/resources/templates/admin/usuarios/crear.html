<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear Usuario - HIS</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0b5ed7;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            color: #0b5ed7;
            margin-top: 0;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        .acciones {
            grid-column: 1 / 3;

            display: flex;
            justify-content: flex-end;
            gap: 12px;

            margin-top: 10px;
        }

        .btn-cancelar {
            padding: 11px 18px;

            background-color: #6c757d;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .btn-crear {
            padding: 11px 18px;

            background-color: #198754;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        .mensaje {
            grid-column: 1 / 3;

            text-align: center;
            min-height: 22px;

            margin-top: 10px;
        }

    </style>
</head>

<body>

<header>

    <h1>
        Sistema Informático Hospitalario
    </h1>

</header>


<div class="contenedor">

    <h2>
        Crear Usuario
    </h2>


    <div class="formulario">


        <div class="campo">

            <label for="nombreCompleto">
                Nombre Completo *
            </label>

            <input
                    type="text"
                    id="nombreCompleto"
                    placeholder="Ingrese el nombre completo">

        </div>


        <div class="campo">

            <label for="correoElectronico">
                Correo Electrónico *
            </label>

            <input
                    type="email"
                    id="correoElectronico"
                    placeholder="correo@hospital.com">

        </div>


        <div class="campo">

            <label for="nombreUsuario">
                Nombre de Usuario *
            </label>

            <input
                    type="text"
                    id="nombreUsuario"
                    placeholder="Ingrese nombre de usuario">

        </div>


        <div class="campo">

            <label for="password">
                Contraseña *
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Ingrese contraseña">

        </div>


        <div class="campo">

            <label for="dpi">
                Documento de Identificación
            </label>

            <input
                    type="text"
                    id="dpi"
                    maxlength="13"
                    placeholder="DPI">

        </div>


        <div class="campo">

            <label for="numeroTelefono">
                Número de Teléfono
            </label>

            <input
                    type="text"
                    id="numeroTelefono"
                    placeholder="Teléfono">

        </div>


        <div class="campo">

            <label for="rol">
                Rol *
            </label>

            <select id="rol"
                    name="rol"
                    required>

                <option value="">
                    Seleccione
                </option>

                <option value="ADMIN">
                    ADMIN
                </option>

                <option value="PACIENTE">
                    PACIENTE
                </option>

                <option value="MEDICO">
                    MEDICO
                </option>

                <option value="ENFERMERO">
                    ENFERMERO
                </option>

                <option value="RECEPCION">
                    RECEPCION
                </option>

                <option value="CAJERO">
                    CAJERO
                </option>

                <option value="LABORATORISTA">
                    LABORATORISTA
                </option>

                <option value="FARMACEUTICO">
                    FARMACEUTICO
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="nit">
                NIT
            </label>

            <input
                    type="text"
                    id="nit"
                    placeholder="NIT">

        </div>


        <div class="campo">

            <label for="numeroSeguro">
                Número de Seguro
            </label>

            <input
                    type="text"
                    id="numeroSeguro"
                    placeholder="Número de seguro">

        </div>


        <div class="campo">

            <label for="sucursal">
                Sucursal
            </label>

            <input
                    type="text"
                    id="sucursal"
                    placeholder="Sucursal">

        </div>


        <div class="campo">

            <label for="especialidad">
                Especialidad
            </label>

            <input
                    type="text"
                    id="especialidad"
                    placeholder="Solo para médicos">

        </div>


        <div class="campo">

            <label for="activo">
                Estado *
            </label>

            <select id="activo">

                <option value="true">
                    Activo
                </option>

                <option value="false">
                    Inactivo
                </option>

            </select>

        </div>


        <div id="mensaje"
             class="mensaje">
        </div>


        <div class="acciones">

            <button
                    type="button"
                    class="btn-cancelar"
                    onclick="cancelar()">

                Cancelar

            </button>


            <button
                    type="button"
                    class="btn-crear"
                    onclick="crearUsuario()">

                Crear

            </button>

        </div>

    </div>

</div>


<script>

    function cancelar() {

        window.location.href =
            "/admin/usuarios";
    }


    async function crearUsuario() {

        const mensaje =
            document.getElementById("mensaje");


        const nombreCompleto =
            document.getElementById("nombreCompleto")
                .value.trim();

        const correoElectronico =
            document.getElementById("correoElectronico")
                .value.trim();

        const nombreUsuario =
            document.getElementById("nombreUsuario")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;

        const dpi =
            document.getElementById("dpi")
                .value.trim();

        const numeroTelefono =
            document.getElementById("numeroTelefono")
                .value.trim();

        const rol =
            document.getElementById("rol")
                .value;

        const nit =
            document.getElementById("nit")
                .value.trim();

        const numeroSeguro =
            document.getElementById("numeroSeguro")
                .value.trim();

        const sucursal =
            document.getElementById("sucursal")
                .value.trim();

        const especialidad =
            document.getElementById("especialidad")
                .value.trim();

        const activo =
            document.getElementById("activo")
                .value === "true";


        if (
            nombreCompleto === "" ||
            correoElectronico === "" ||
            nombreUsuario === "" ||
            password === "" ||
            rol === ""
        ) {

            mensaje.style.color =
                "#b02a37";

            mensaje.textContent =
                "Complete todos los campos obligatorios.";

            return;
        }


        try {

            const respuesta =
                await fetch(
                    "/api/admin/usuarios",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            nombreCompleto:
                            nombreCompleto,

                            correoElectronico:
                            correoElectronico,

                            nombreUsuario:
                            nombreUsuario,

                            password:
                            password,

                            dpi:
                                dpi === "" ? null : dpi,

                            numeroTelefono:
                                numeroTelefono === ""
                                    ? null
                                    : numeroTelefono,

                            rol:
                            rol,

                            nit:
                                nit === "" ? null : nit,

                            numeroSeguro:
                                numeroSeguro === ""
                                    ? null
                                    : numeroSeguro,

                            sucursal:
                                sucursal === ""
                                    ? null
                                    : sucursal,

                            especialidad:
                                especialidad === ""
                                    ? null
                                    : especialidad,

                            activo:
                            activo

                        })

                    }
                );


            const datos =
                await respuesta.json();


            if (!respuesta.ok) {

                mensaje.style.color =
                    "#b02a37";

                mensaje.textContent =
                    datos.mensaje ||
                    "No fue posible crear el usuario.";

                return;
            }


            mensaje.style.color =
                "green";

            mensaje.textContent =
                "Usuario creado correctamente.";


            setTimeout(
                function () {

                    window.location.href =
                        "/admin/usuarios";

                },

                1000
            );

        }

        catch (error) {

            console.error(error);

            mensaje.style.color =
                "#b02a37";

            mensaje.textContent =
                "No se pudo conectar con el servidor.";
        }
    }

</script>

</body>
</html>
