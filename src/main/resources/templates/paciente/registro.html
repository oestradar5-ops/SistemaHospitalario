<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro de Paciente - HIS</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0b5ed7;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 850px;
            margin: 35px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            color: #0b5ed7;
            margin-top: 0;
        }

        .descripcion {
            color: #666;
            margin-bottom: 25px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        .campo-error {
            border-color: #dc3545 !important;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            min-height: 16px;
        }

        .contador {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-top: 4px;
        }

        .mensaje {
            grid-column: 1 / 3;
            text-align: center;
            min-height: 22px;
            font-weight: bold;
        }

        .acciones {
            grid-column: 1 / 3;

            display: flex;
            justify-content: flex-end;
            gap: 12px;

            margin-top: 10px;
        }

        .btn-volver {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;

            background-color: #6c757d;
            color: white;

            cursor: pointer;
        }

        .btn-registrar {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;

            background-color: #198754;
            color: white;

            cursor: pointer;
        }

        @media (max-width: 700px) {

            .formulario {
                grid-template-columns: 1fr;
            }

            .mensaje,
            .acciones {
                grid-column: 1;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>Sistema Informático Hospitalario</h1>
</header>


<div class="contenedor">

    <h2>Registro de Paciente</h2>

    <p class="descripcion">
        Complete sus datos para crear una cuenta
        y acceder al sistema de citas médicas.
    </p>


    <div class="formulario">


        <!-- NOMBRE -->

        <div class="campo">

            <label for="nombreCompleto">
                Nombre Completo *
            </label>

            <input
                    type="text"
                    id="nombreCompleto"
                    placeholder="Ingrese su nombre completo">

            <div
                    id="errorNombre"
                    class="error">
            </div>

        </div>


        <!-- DPI -->

        <div class="campo">

            <label for="dpi">
                DPI *
            </label>

            <input
                    type="text"
                    id="dpi"
                    maxlength="13"
                    inputmode="numeric"
                    placeholder="13 dígitos"
                    oninput="validarDpiEntrada()">

            <div class="contador">
                <span id="contadorDpi">0</span>/13
            </div>

            <div
                    id="errorDpi"
                    class="error">
            </div>

        </div>


        <!-- NIT -->

        <div class="campo">

            <label for="nit">
                NIT *
            </label>

            <input
                    type="text"
                    id="nit"
                    placeholder="Ingrese su NIT">

            <div
                    id="errorNit"
                    class="error">
            </div>

        </div>


        <!-- TELÉFONO -->

        <div class="campo">

            <label for="telefono">
                Número de Teléfono *
            </label>

            <input
                    type="text"
                    id="telefono"
                    placeholder="Ingrese su teléfono">

            <div
                    id="errorTelefono"
                    class="error">
            </div>

        </div>


        <!-- SEGURO -->

        <div class="campo">

            <label for="seguro">
                Número de Afiliado del Seguro
            </label>

            <input
                    type="text"
                    id="seguro"
                    placeholder="Opcional">

            <div
                    id="errorSeguro"
                    class="error">
            </div>

        </div>


        <!-- CORREO -->

        <div class="campo">

            <label for="correo">
                Correo Electrónico *
            </label>

            <input
                    type="email"
                    id="correo"
                    placeholder="correo@ejemplo.com">

            <div
                    id="errorCorreo"
                    class="error">
            </div>

        </div>


        <!-- USUARIO -->

        <div class="campo">

            <label for="nombreUsuario">
                Nombre de Usuario *
            </label>

            <input
                    type="text"
                    id="nombreUsuario"
                    maxlength="9"
                    placeholder="8 a 9 caracteres">

            <div
                    id="errorUsuario"
                    class="error">
            </div>

        </div>


        <!-- CONTRASEÑA -->

        <div class="campo">

            <label for="password">
                Contraseña *
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 12 caracteres">

            <div
                    id="errorPassword"
                    class="error">
            </div>

        </div>


        <div
                id="mensaje"
                class="mensaje">
        </div>


        <div class="acciones">

            <button
                    type="button"
                    class="btn-volver"
                    onclick="volverPortal()">

                Volver al portal

            </button>


            <button
                    type="button"
                    class="btn-registrar"
                    onclick="registrarPaciente()">

                Registrarse

            </button>

        </div>

    </div>

</div>


<script>

    function validarDpiEntrada() {

        const dpi =
            document.getElementById("dpi");

        dpi.value =
            dpi.value.replace(/\D/g, "");

        document.getElementById(
            "contadorDpi"
        ).textContent =
            dpi.value.length;
    }


    function limpiarErrores() {

        const ids = [
            "nombreCompleto",
            "dpi",
            "nit",
            "telefono",
            "correo",
            "nombreUsuario",
            "password"
        ];

        ids.forEach(id => {

            document
                .getElementById(id)
                .classList
                .remove("campo-error");
        });


        const errores = [
            "errorNombre",
            "errorDpi",
            "errorNit",
            "errorTelefono",
            "errorCorreo",
            "errorUsuario",
            "errorPassword"
        ];

        errores.forEach(id => {

            document.getElementById(id)
                .textContent = "";
        });
    }


    function marcarError(
        campo,
        error,
        texto
    ) {

        document.getElementById(campo)
            .classList.add("campo-error");

        document.getElementById(error)
            .textContent = texto;
    }


    function volverPortal() {

        window.location.href = "/";
    }


    async function registrarPaciente() {

        limpiarErrores();

        const mensaje =
            document.getElementById("mensaje");


        const datos = {

            nombreCompleto:
                document.getElementById(
                    "nombreCompleto"
                ).value.trim(),

            dpi:
                document.getElementById(
                    "dpi"
                ).value.trim(),

            nit:
                document.getElementById(
                    "nit"
                ).value.trim(),

            numeroTelefono:
                document.getElementById(
                    "telefono"
                ).value.trim(),

            numeroSeguro:
                document.getElementById(
                    "seguro"
                ).value.trim(),

            correoElectronico:
                document.getElementById(
                    "correo"
                ).value.trim(),

            nombreUsuario:
                document.getElementById(
                    "nombreUsuario"
                ).value.trim(),

            password:
            document.getElementById(
                "password"
            ).value

        };


        let valido = true;


        if (datos.nombreCompleto === "") {

            marcarError(
                "nombreCompleto",
                "errorNombre",
                "El nombre completo es obligatorio."
            );

            valido = false;
        }


        if (!/^\d{13}$/.test(datos.dpi)) {

            marcarError(
                "dpi",
                "errorDpi",
                "El DPI debe contener exactamente 13 dígitos."
            );

            valido = false;
        }


        if (datos.nit === "") {

            marcarError(
                "nit",
                "errorNit",
                "El NIT es obligatorio."
            );

            valido = false;
        }


        if (datos.numeroTelefono === "") {

            marcarError(
                "telefono",
                "errorTelefono",
                "El número de teléfono es obligatorio."
            );

            valido = false;
        }


        const expresionCorreo =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
            !expresionCorreo.test(
                datos.correoElectronico
            )
        ) {

            marcarError(
                "correo",
                "errorCorreo",
                "Ingrese un correo electrónico válido."
            );

            valido = false;
        }


        if (
            datos.nombreUsuario.length < 8 ||
            datos.nombreUsuario.length > 9
        ) {

            marcarError(
                "nombreUsuario",
                "errorUsuario",
                "El nombre de usuario debe tener entre 8 y 9 caracteres."
            );

            valido = false;
        }


        if (
            datos.password.length < 12
        ) {

            marcarError(
                "password",
                "errorPassword",
                "La contraseña debe contener como mínimo 12 caracteres."
            );

            valido = false;
        }


        if (!valido) {

            mensaje.style.color =
                "#dc3545";

            mensaje.textContent =
                "Revise los campos marcados.";

            return;
        }


        mensaje.style.color = "#666";

        mensaje.textContent =
            "Registrando usuario...";


        try {

            const respuesta =
                await fetch(
                    "/api/registro",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(datos)

                    }
                );


            const resultado =
                await respuesta.json();


            if (
                resultado.estado !== "OK"
            ) {

                mensaje.style.color =
                    "#dc3545";

                mensaje.textContent =
                    resultado.mensaje;

                return;
            }


            mensaje.style.color =
                "green";

            mensaje.textContent =
                "¡Registro exitoso! Su cuenta ha sido creada. " +
                "Ahora puede iniciar sesión con sus credenciales.";


            setTimeout(
                function () {

                    window.location.href =
                        "/login";

                },

                2000
            );

        }

        catch (error) {

            console.error(error);

            mensaje.style.color =
                "#dc3545";

            mensaje.textContent =
                "No se pudo conectar con el servidor.";
        }
    }

</script>

</body>

</html>
