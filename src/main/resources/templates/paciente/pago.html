<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pago de Cita - HIS</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
    }

    header {
      background-color: #0b5ed7;
      color: white;
      padding: 20px 40px;
    }

    header h1 {
      margin: 0;
    }

    .contenedor {
      max-width: 850px;
      margin: 30px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      color: #0b5ed7;
      margin-top: 0;
    }

    .resumen {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .resumen p {
      margin: 8px 0;
    }

    .monto {
      font-size: 24px;
      font-weight: bold;
      color: #198754;
      margin-top: 15px;
    }

    .formulario {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo-completo {
      grid-column: 1 / 3;
    }

    label {
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      padding: 11px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #0b5ed7;
    }

    .mensaje {
      grid-column: 1 / 3;
      text-align: center;
      min-height: 22px;
      font-weight: bold;
    }

    .acciones {
      grid-column: 1 / 3;
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    button {
      padding: 11px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-volver {
      background-color: #6c757d;
      color: white;
    }

    .btn-pagar {
      background-color: #198754;
      color: white;
    }

    .referencia {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f5e9;
      border-radius: 6px;
      display: none;
    }

    @media (max-width: 700px) {

      .formulario {
        grid-template-columns: 1fr;
      }

      .campo-completo,
      .mensaje,
      .acciones {
        grid-column: 1;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>Sistema Informático Hospitalario</h1>
</header>


<div class="contenedor">

  <h2>Pago de Cita Médica</h2>


  <input
          type="hidden"
          id="citaId"
          th:value="${cita.id}">


  <div class="resumen">

    <h3>Resumen de la cita</h3>

    <p>
      <strong>Sucursal:</strong>
      <span th:text="${cita.sucursal.nombre}">
                Hospital
            </span>
    </p>

    <p>
      <strong>Especialidad:</strong>
      <span th:text="${cita.especialidad.nombre}">
                Especialidad
            </span>
    </p>

    <p>
      <strong>Médico:</strong>
      <span th:text="${cita.medico.usuario.nombreCompleto}">
                Médico
            </span>
    </p>

    <p>
      <strong>Fecha:</strong>
      <span th:text="${cita.horario.fecha}">
                Fecha
            </span>
    </p>

    <p>
      <strong>Hora:</strong>
      <span th:text="${cita.horario.hora}">
                Hora
            </span>
    </p>

    <p>
      <strong>Estado:</strong>
      <span th:text="${cita.estado}">
                PENDIENTE_DE_PAGO
            </span>
    </p>

    <div class="monto">
      Total a pagar:
      Q<span th:text="${monto}">
                250.00
            </span>
    </div>

  </div>


  <h3>Datos de la tarjeta</h3>


  <div class="formulario">

    <div class="campo campo-completo">

      <label for="numeroTarjeta">
        Número de Tarjeta *
      </label>

      <input
              type="text"
              id="numeroTarjeta"
              maxlength="19"
              inputmode="numeric"
              placeholder="1234 5678 9012 3456"
              oninput="formatearTarjeta()">

    </div>


    <div class="campo campo-completo">

      <label for="titular">
        Nombre del Titular *
      </label>

      <input
              type="text"
              id="titular"
              placeholder="Nombre como aparece en la tarjeta">

    </div>


    <div class="campo">

      <label for="vencimiento">
        Vencimiento *
      </label>

      <input
              type="text"
              id="vencimiento"
              maxlength="5"
              placeholder="MM/AA"
              oninput="formatearVencimiento()">

    </div>


    <div class="campo">

      <label for="cvv">
        CVV *
      </label>

      <input
              type="password"
              id="cvv"
              maxlength="3"
              inputmode="numeric"
              placeholder="123"
              oninput="soloNumerosCvv()">

    </div>


    <div
            id="mensaje"
            class="mensaje">
    </div>


    <div
            id="referenciaPago"
            class="referencia campo-completo">

      <strong>Referencia de transacción:</strong>

      <span id="referenciaTexto">
            </span>

    </div>


    <div class="acciones">

      <button
              type="button"
              class="btn-volver"
              onclick="volverDashboard()">

        Volver

      </button>


      <button
              type="button"
              class="btn-pagar"
              id="btnPagar"
              onclick="realizarPago()">

        Realizar Pago

      </button>

    </div>

  </div>

</div>


<script>

  function formatearTarjeta() {

    const input =
            document.getElementById("numeroTarjeta");

    let valor =
            input.value.replace(/\D/g, "");

    valor =
            valor.substring(0, 16);

    input.value =
            valor.replace(
                    /(.{4})/g,
                    "$1 "
            ).trim();
  }


  function formatearVencimiento() {

    const input =
            document.getElementById("vencimiento");

    let valor =
            input.value.replace(/\D/g, "");

    valor =
            valor.substring(0, 4);

    if (valor.length >= 3) {

      valor =
              valor.substring(0, 2) +
              "/" +
              valor.substring(2);
    }

    input.value = valor;
  }


  function soloNumerosCvv() {

    const input =
            document.getElementById("cvv");

    input.value =
            input.value
                    .replace(/\D/g, "")
                    .substring(0, 3);
  }


  async function realizarPago() {

    const mensaje =
            document.getElementById("mensaje");

    const boton =
            document.getElementById("btnPagar");


    const citaId =
            document.getElementById("citaId")
                    .value;


    const numeroTarjeta =
            document.getElementById("numeroTarjeta")
                    .value.trim();


    const titular =
            document.getElementById("titular")
                    .value.trim();


    const vencimiento =
            document.getElementById("vencimiento")
                    .value.trim();


    const cvv =
            document.getElementById("cvv")
                    .value.trim();


    if (
            numeroTarjeta.replace(/\s/g, "").length !== 16
    ) {

      mensaje.style.color =
              "#dc3545";

      mensaje.textContent =
              "Ingrese un número de tarjeta válido de 16 dígitos.";

      return;
    }


    if (titular === "") {

      mensaje.style.color =
              "#dc3545";

      mensaje.textContent =
              "Debe ingresar el nombre del titular.";

      return;
    }


    if (
            !/^(0[1-9]|1[0-2])\/\d{2}$/
                    .test(vencimiento)
    ) {

      mensaje.style.color =
              "#dc3545";

      mensaje.textContent =
              "Ingrese una fecha de vencimiento válida en formato MM/AA.";

      return;
    }


    if (!/^\d{3}$/.test(cvv)) {

      mensaje.style.color =
              "#dc3545";

      mensaje.textContent =
              "El CVV debe contener 3 dígitos.";

      return;
    }


    mensaje.style.color =
            "#666";

    mensaje.textContent =
            "Procesando pago...";

    boton.disabled = true;


    try {

      const respuesta =
              await fetch(
                      "/api/pagos/procesar",
                      {

                        method: "POST",

                        headers: {
                          "Content-Type":
                                  "application/json"
                        },

                        body:
                                JSON.stringify({

                                  citaId:
                                  citaId,

                                  numeroTarjeta:
                                  numeroTarjeta,

                                  titular:
                                  titular,

                                  vencimiento:
                                  vencimiento,

                                  cvv:
                                  cvv

                                })

                      }
              );


      const resultado =
              await respuesta.json();


      if (
              resultado.estado !== "OK"
      ) {

        mensaje.style.color =
                "#dc3545";

        mensaje.textContent =
                resultado.mensaje;

        boton.disabled =
                false;

        return;
      }


      mensaje.style.color =
              "green";

      mensaje.textContent =
              resultado.mensaje;


      document
              .getElementById(
                      "referenciaPago"
              )
              .style.display =
              "block";


      document
              .getElementById(
                      "referenciaTexto"
              )
              .textContent =
              resultado.referencia;


      boton.textContent =
              "Pago realizado";

      boton.disabled =
              true;


      setTimeout(
              function () {

                window.location.href =
                        "/paciente/pago/comprobante?citaId=" +
                        resultado.citaId;

              },
              2000
      );


    } catch (error) {

      console.error(error);

      mensaje.style.color =
              "#dc3545";

      mensaje.textContent =
              "No se pudo conectar con el servidor.";

      boton.disabled =
              false;
    }
  }


  function volverDashboard() {

    window.location.href =
            "/paciente/dashboard";
  }

</script>

</body>
</html>
