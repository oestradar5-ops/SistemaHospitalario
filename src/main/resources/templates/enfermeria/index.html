<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enfermería - HIS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            color: #1f2937;
        }

        /* =========================================
           ENCABEZADO
           ========================================= */

        header {
            background-color: #0b5ed7;
            color: white;

            padding: 22px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .usuario {
            text-align: right;
        }

        .usuario p {
            margin: 3px 0;
        }

        .usuario a {
            color: white;
            text-decoration: none;
        }

        /* =========================================
           CONTENIDO
           ========================================= */

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .resumen {
            background-color: white;

            padding: 20px 25px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.08);
        }

        .resumen h2 {
            margin-top: 0;
            color: #0b5ed7;
        }

        /* =========================================
           SECCIONES
           ========================================= */

        .seccion {
            background-color: white;

            border-radius: 12px;

            margin-bottom: 30px;

            overflow: hidden;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.08);
        }

        .seccion-titulo {
            padding: 20px 25px;

            background-color: #f8fafc;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seccion-titulo h2 {
            margin: 0;
            color: #0b5ed7;
        }

        .contador {
            background-color: #0b5ed7;
            color: white;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 14px;
        }

        /* =========================================
           TARJETAS
           ========================================= */

        .lista {
            padding: 20px;
        }

        .tarjeta {
            border: 1px solid #dbe2ea;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 15px;

            display: grid;

            grid-template-columns:
                    1fr auto;

            gap: 20px;

            align-items: center;
        }

        .tarjeta:last-child {
            margin-bottom: 0;
        }

        .datos-principales h3 {
            margin: 0 0 10px;

            color: #1d4ed8;
        }

        .datos-grid {
            display: grid;

            grid-template-columns:
                    repeat(2, minmax(180px, 1fr));

            gap: 8px 25px;
        }

        .dato {
            font-size: 14px;
        }

        .dato strong {
            color: #475569;
        }

        /* =========================================
           PRIORIDAD
           ========================================= */

        .prioridad {
            display: inline-block;

            margin-top: 10px;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 13px;

            font-weight: bold;
        }

        .normal {
            background-color: #dcfce7;
            color: #166534;
        }

        .emergencia {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        /* =========================================
           BOTONES
           ========================================= */

        button,
        .boton {
            border: none;

            border-radius: 6px;

            padding: 11px 16px;

            font-size: 14px;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            text-align: center;
        }

        .btn-llamar {
            background-color: #0b5ed7;
            color: white;
        }

        .btn-llamar:hover {
            background-color: #084298;
        }

        .btn-signos {
            background-color: #198754;
            color: white;
        }

        .btn-signos:hover {
            background-color: #146c43;
        }

        .acciones {
            min-width: 190px;
            text-align: right;
        }

        /* =========================================
           MENSAJES
           ========================================= */

        .mensaje {
            margin-bottom: 20px;

            padding: 14px 18px;

            border-radius: 8px;

            display: none;
        }

        .mensaje.exito {
            display: block;
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .mensaje.error {
            display: block;
            background-color: #f8d7da;
            color: #842029;
        }

        .vacio {
            text-align: center;

            color: #64748b;

            padding: 30px;
        }

        /* =========================================
           RESPONSIVE
           ========================================= */

        @media (max-width: 750px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .usuario {
                text-align: left;
            }

            .tarjeta {
                grid-template-columns: 1fr;
            }

            .datos-grid {
                grid-template-columns: 1fr;
            }

            .acciones {
                text-align: left;
            }
        }

    </style>

</head>


<body>


<header>

    <div>

        <h1>
            Panel de Enfermería
        </h1>

    </div>


    <div class="usuario">

        <p>
            Usuario:
            <strong th:text="${usuarioActual}">
                enferme01
            </strong>
        </p>

        <p>
            <a href="/enfermeria/logout">
                Cerrar sesión
            </a>
        </p>

    </div>

</header>


<main>


    <section class="resumen">

        <h2>
            Toma de Signos Vitales
        </h2>

        <p>
            Pacientes que han registrado su llegada
            y se encuentran esperando atención de enfermería.
        </p>

    </section>


    <div
            id="mensaje"
            class="mensaje">
    </div>


    <!-- =========================================
         PACIENTES PRESENTES
         ========================================= -->

    <section class="seccion">

        <div class="seccion-titulo">

            <h2>
                Pacientes esperando
            </h2>

            <span
                    id="contadorPresentes"
                    class="contador">

                0

            </span>

        </div>


        <div
                id="listaPresentes"
                class="lista">

            <div class="vacio">
                Cargando pacientes...
            </div>

        </div>

    </section>


    <!-- =========================================
         PACIENTES EN SIGNOS
         ========================================= -->

    <section class="seccion">

        <div class="seccion-titulo">

            <h2>
                En toma de signos vitales
            </h2>

            <span
                    id="contadorSignos"
                    class="contador">

                0

            </span>

        </div>


        <div
                id="listaSignos"
                class="lista">

            <div class="vacio">
                Cargando pacientes...
            </div>

        </div>

    </section>


</main>


<script>

    // ==========================================
    // ESCAPAR HTML
    // ==========================================

    function escapar(valor) {

        if (valor === null ||
            valor === undefined) {

            return "";
        }

        return String(valor)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    // ==========================================
    // MOSTRAR MENSAJE
    // ==========================================

    function mostrarMensaje(
        texto,
        tipo
    ) {

        const mensaje =
            document.getElementById("mensaje");

        mensaje.className =
            "mensaje " + tipo;

        mensaje.textContent =
            texto;


        setTimeout(
            function () {

                mensaje.className =
                    "mensaje";

                mensaje.textContent =
                    "";

            },
            5000
        );
    }


    // ==========================================
    // FORMATEAR HORA DE LLEGADA
    // ==========================================

    function formatearHora(
        fechaHora
    ) {

        if (!fechaHora ||
            fechaHora === "No registrada") {

            return "No registrada";
        }


        try {

            const fecha =
                new Date(fechaHora);

            return fecha
                .toLocaleTimeString(
                    "es-GT",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }

        catch (error) {

            return fechaHora;
        }
    }


    // ==========================================
    // SÍNTESIS DE VOZ
    // ==========================================

    function anunciarPaciente(
        citaId,
        paciente
    ) {

        if (!("speechSynthesis" in window)) {

            return;
        }


        window.speechSynthesis.cancel();


        const texto =
            "Turno número " +
            citaId +
            ". Paciente " +
            paciente +
            ", favor pasar a toma de signos vitales.";


        const mensajeVoz =
            new SpeechSynthesisUtterance(
                texto
            );


        mensajeVoz.lang =
            "es-GT";


        mensajeVoz.rate =
            0.9;


        window.speechSynthesis.speak(
            mensajeVoz
        );
    }


    // ==========================================
    // CARGAR PACIENTES
    // ==========================================

    async function cargarPacientes() {

        await Promise.all([
            cargarPresentes(),
            cargarEnSignos()
        ]);
    }


    // ==========================================
    // PACIENTES PRESENTES
    // ==========================================

    async function cargarPresentes() {

        const contenedor =
            document.getElementById(
                "listaPresentes"
            );


        try {

            const respuesta =
                await fetch(
                    "/api/enfermeria/pacientes-presentes"
                );


            const pacientes =
                await respuesta.json();


            document
                .getElementById(
                    "contadorPresentes"
                )
                .textContent =
                pacientes.length;


            if (pacientes.length === 0) {

                contenedor.innerHTML =
                    `
                    <div class="vacio">
                        No hay pacientes esperando
                        toma de signos vitales.
                    </div>
                    `;

                return;
            }


            contenedor.innerHTML =
                pacientes
                    .map(
                        paciente =>
                            crearTarjetaPresente(
                                paciente
                            )
                    )
                    .join("");

        }

        catch (error) {

            console.error(error);

            contenedor.innerHTML =
                `
                <div class="vacio">
                    No fue posible cargar
                    los pacientes.
                </div>
                `;
        }
    }


    // ==========================================
    // CREAR TARJETA PRESENTE
    // ==========================================

    function crearTarjetaPresente(
        paciente
    ) {

        const prioridad =
            paciente.prioridad ||
            "NORMAL";


        const clasePrioridad =
            prioridad.toUpperCase() ===
            "EMERGENCIA"
                ? "emergencia"
                : "normal";


        return `
            <div class="tarjeta">

                <div class="datos-principales">

                    <h3>
                        ${escapar(paciente.paciente)}
                    </h3>

                    <div class="datos-grid">

                        <div class="dato">
                            <strong>No. Cita:</strong>
                            ${escapar(paciente.citaId)}
                        </div>

                        <div class="dato">
                            <strong>DPI:</strong>
                            ${escapar(paciente.dpi)}
                        </div>

                        <div class="dato">
                            <strong>Especialidad:</strong>
                            ${escapar(paciente.especialidad)}
                        </div>

                        <div class="dato">
                            <strong>Médico:</strong>
                            ${escapar(paciente.medico)}
                        </div>

                        <div class="dato">
                            <strong>Hora de llegada:</strong>
                            ${escapar(
            formatearHora(
                paciente.horaLlegada
            )
        )}
                        </div>

                        <div class="dato">
                            <strong>Estado:</strong>
                            ${escapar(paciente.estado)}
                        </div>

                    </div>

                    <span class="prioridad ${clasePrioridad}">
                        ${escapar(prioridad)}
                    </span>

                </div>


                <div class="acciones">

                    <button
                        type="button"
                        class="btn-llamar"
                        onclick="llamarPaciente(
                            ${Number(paciente.citaId)}
                        )">

                        🔊 Llamar y Tomar Signos

                    </button>

                </div>

            </div>
        `;
    }


    // ==========================================
    // PACIENTES EN SIGNOS
    // ==========================================

    async function cargarEnSignos() {

        const contenedor =
            document.getElementById(
                "listaSignos"
            );


        try {

            const respuesta =
                await fetch(
                    "/api/enfermeria/en-signos"
                );


            const pacientes =
                await respuesta.json();


            document
                .getElementById(
                    "contadorSignos"
                )
                .textContent =
                pacientes.length;


            if (pacientes.length === 0) {

                contenedor.innerHTML =
                    `
                    <div class="vacio">
                        No hay pacientes actualmente
                        en toma de signos vitales.
                    </div>
                    `;

                return;
            }


            contenedor.innerHTML =
                pacientes
                    .map(
                        paciente =>
                            crearTarjetaSignos(
                                paciente
                            )
                    )
                    .join("");

        }

        catch (error) {

            console.error(error);

            contenedor.innerHTML =
                `
                <div class="vacio">
                    No fue posible cargar
                    los pacientes.
                </div>
                `;
        }
    }


    // ==========================================
    // CREAR TARJETA SIGNOS
    // ==========================================

    function crearTarjetaSignos(
        paciente
    ) {

        const prioridad =
            paciente.prioridad ||
            "NORMAL";


        const clasePrioridad =
            prioridad.toUpperCase() ===
            "EMERGENCIA"
                ? "emergencia"
                : "normal";


        return `
            <div class="tarjeta">

                <div class="datos-principales">

                    <h3>
                        ${escapar(paciente.paciente)}
                    </h3>

                    <div class="datos-grid">

                        <div class="dato">
                            <strong>No. Cita:</strong>
                            ${escapar(paciente.citaId)}
                        </div>

                        <div class="dato">
                            <strong>DPI:</strong>
                            ${escapar(paciente.dpi)}
                        </div>

                        <div class="dato">
                            <strong>Especialidad:</strong>
                            ${escapar(paciente.especialidad)}
                        </div>

                        <div class="dato">
                            <strong>Médico:</strong>
                            ${escapar(paciente.medico)}
                        </div>

                        <div class="dato">
                            <strong>Estado:</strong>
                            ${escapar(paciente.estado)}
                        </div>

                    </div>

                    <span class="prioridad ${clasePrioridad}">
                        ${escapar(prioridad)}
                    </span>

                </div>


                <div class="acciones">

                    <a
                        class="boton btn-signos"
                        href="/enfermeria/signos/${Number(paciente.citaId)}">

                        Registrar Signos Vitales

                    </a>

                </div>

            </div>
        `;
    }


    // ==========================================
    // LLAMAR PACIENTE
    // ==========================================

    async function llamarPaciente(
        citaId
    ) {

        try {

            const respuesta =
                await fetch(
                    "/api/enfermeria/citas/" +
                    citaId +
                    "/llamar",
                    {
                        method: "POST"
                    }
                );


            const datos =
                await respuesta.json();


            if (datos.estado !== "OK") {

                mostrarMensaje(
                    datos.mensaje,
                    "error"
                );

                return;
            }


            anunciarPaciente(
                datos.citaId,
                datos.paciente
            );


            mostrarMensaje(
                "Paciente " +
                datos.paciente +
                " llamado correctamente.",
                "exito"
            );


            await cargarPacientes();

        }

        catch (error) {

            console.error(error);

            mostrarMensaje(
                "No fue posible llamar al paciente.",
                "error"
            );
        }
    }


    // ==========================================
    // CARGAR AL INICIAR
    // ==========================================

    cargarPacientes();


    // Actualización automática
    // cada 15 segundos.

    setInterval(
        cargarPacientes,
        15000
    );

</script>


</body>
</html>
