<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enfermería - HIS</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .contenedor {
            width: 390px;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                    0 4px 18px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;

            text-align: center;

            color: #0b5ed7;
        }

        .subtitulo {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #aaa;

            border-radius: 6px;

            font-size: 16px;
        }

        .boton {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #0b5ed7;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .boton:hover {
            background-color: #084298;
        }

        .mensaje {
            margin-top: 15px;

            min-height: 22px;

            text-align: center;

            color: #b02a37;
        }

        .volver {
            margin-top: 20px;

            text-align: center;
        }

        .volver a {
            color: #0b5ed7;

            text-decoration: none;
        }

    </style>
</head>


<body>

<div class="contenedor">

    <h1>
        Enfermería
    </h1>

    <p class="subtitulo">
        Sistema Informático Hospitalario
    </p>


    <div class="campo">

        <label for="usuario">
            Nombre de usuario
        </label>

        <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario">

    </div>


    <div class="campo">

        <label for="password">
            Contraseña
        </label>

        <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña">

    </div>


    <button
            type="button"
            class="boton"
            onclick="iniciarSesion()">

        Iniciar Sesión

    </button>


    <div
            id="mensaje"
            class="mensaje">
    </div>


    <div class="volver">

        <a href="/panel">
            Volver al panel principal
        </a>

    </div>

</div>


<script>

    async function iniciarSesion() {

        const usuario =
            document
                .getElementById("usuario")
                .value.trim();


        const password =
            document
                .getElementById("password")
                .value;


        const mensaje =
            document
                .getElementById("mensaje");


        if (usuario === "" ||
            password === "") {

            mensaje.style.color =
                "#b02a37";


            mensaje.textContent =
                "Debe ingresar usuario y contraseña.";


            return;
        }


        mensaje.style.color =
            "#666";


        mensaje.textContent =
            "Validando credenciales...";


        try {

            const respuesta =
                await fetch(
                    "/api/enfermeria/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                nombreUsuario:
                                usuario,

                                password:
                                password
                            })
                    }
                );


            const datos =
                await respuesta.json();


            if (datos.estado === "OK") {

                mensaje.style.color =
                    "green";


                mensaje.textContent =
                    "Inicio de sesión exitoso.";


                setTimeout(
                    function () {

                        window.location.href =
                            "/enfermeria";

                    },

                    600
                );


                return;
            }


            mensaje.style.color =
                "#b02a37";


            mensaje.textContent =
                datos.mensaje;

        }

        catch (error) {

            console.error(error);


            mensaje.style.color =
                "#b02a37";


            mensaje.textContent =
                "No se pudo conectar con el servidor.";
        }
    }


    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    iniciarSesion();
                }
            }
        );

</script>


</body>
</html>
