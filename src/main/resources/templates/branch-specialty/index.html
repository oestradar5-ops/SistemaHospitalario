<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Especialidades por Sede | HIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f766e;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .contenedor {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0;
            color: #0f766e;
        }

        .boton {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .boton-verde {
            background: #0f766e;
            color: white;
        }

        .boton-verde:hover {
            background: #115e59;
        }

        .boton-gris {
            background: #64748b;
            color: white;
        }

        .boton-rojo {
            background: #dc2626;
            color: white;
        }

        .boton-rojo:hover {
            background: #b91c1c;
        }

        .busqueda {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .busqueda input {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            width: 220px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0f766e;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .activo {
            background: #dcfce7;
            color: #166534;
        }

        .inactivo {
            background: #fee2e2;
            color: #991b1b;
        }

        .alerta {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 7px;
        }

        .exito {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        .paginacion a {
            text-decoration: none;
            color: #0f766e;
            font-weight: bold;
        }

        .paginacion a:hover {
            text-decoration: underline;
        }

        .acciones {
            display: flex;
            gap: 8px;
        }

        .acciones form {
            margin: 0;
        }

        .sin-registros {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        .pie {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏥 Sistema Hospitalario HIS</h1>
    <p>Administración de Especialidades por Sede</p>
</header>

<div class="contenedor">

    <div class="tarjeta">

        <div class="encabezado">

            <h2>Especialidades por Sede</h2>

            <a th:href="@{/branch-specialty/create}"
               class="boton boton-verde">
                + Nueva asignación
            </a>

        </div>

        <!-- MENSAJES -->

        <div th:if="${mensaje}"
             class="alerta exito"
             th:text="${mensaje}">
        </div>

        <div th:if="${error}"
             class="alerta error"
             th:text="${error}">
        </div>

        <!-- BÚSQUEDA -->

        <form th:action="@{/branch-specialty}"
              method="get"
              class="busqueda">

            <input type="number"
                   name="id"
                   min="1"
                   placeholder="Buscar por ID"
                   th:value="${idBusqueda}">

            <button type="submit"
                    class="boton boton-verde">
                Buscar
            </button>

            <a th:href="@{/branch-specialty}"
               class="boton boton-gris">
                Limpiar
            </a>

        </form>

        <!-- TABLA -->

        <div class="tabla-contenedor">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Sede</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="asignacion : ${asignaciones.content}">

                    <td th:text="${asignacion.id}"></td>

                    <td th:text="${asignacion.sucursal.nombre}"></td>

                    <td th:text="${asignacion.especialidad.nombre}"></td>

                    <td>

                        <span class="estado"
                              th:classappend="${asignacion.activo} ? ' activo' : ' inactivo'"
                              th:text="${asignacion.activo} ? 'ACTIVA' : 'INACTIVA'">
                        </span>

                    </td>

                    <td>

                        <div class="acciones">

                            <!-- ELIMINACIÓN LÓGICA -->

                            <form th:if="${asignacion.activo}"
                                  th:action="@{/branch-specialty/delete/{id}(id=${asignacion.id})}"
                                  method="post"
                                  onsubmit="return confirm('¿Está seguro de eliminar esta asignación?');">

                                <!-- PROTECCIÓN CSRF -->

                                <input type="hidden"
                                       th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <button type="submit"
                                        class="boton boton-rojo">
                                    Eliminar
                                </button>

                            </form>

                            <span th:unless="${asignacion.activo}">
                                Sin acciones
                            </span>

                        </div>

                    </td>

                </tr>

                <tr th:if="${asignaciones.empty}">
                    <td colspan="5" class="sin-registros">
                        No se encontraron asignaciones registradas.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

        <!-- PAGINACIÓN -->

        <div class="paginacion"
             th:if="${totalPaginas > 1}">

            <a th:if="${paginaActual > 0}"
               th:href="@{/branch-specialty(page=${paginaActual - 1}, id=${idBusqueda})}">
                ← Anterior
            </a>

            <span>
                Página
                <strong th:text="${paginaActual + 1}"></strong>
                de
                <strong th:text="${totalPaginas}"></strong>
            </span>

            <a th:if="${paginaActual + 1 < totalPaginas}"
               th:href="@{/branch-specialty(page=${paginaActual + 1}, id=${idBusqueda})}">
                Siguiente →
            </a>

        </div>

        <!-- REGRESAR -->

        <div class="pie">

            <a th:href="@{/panel}"
               class="boton boton-gris">
                ← Volver al panel
            </a>

        </div>

    </div>

</div>

</body>
</html>
